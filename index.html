<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Idade - Agify API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Descubra a Idade do seu Nome</h1>
        <p>Insira um nome abaixo para ver a estimativa de idade.</p>
        
        <div class="search-box">
            <input type="text" id="nameInput" placeholder="Digite um nome (ex: Maria)">
            <button id="searchBtn">Consultar</button>
        </div>

        <div id="result" class="result-box hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
